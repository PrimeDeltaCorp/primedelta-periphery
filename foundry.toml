# Changing evm_version / optimizer_runs / via_ir / bytecodeHash invalidates
# PoolAddress.POOL_INIT_CODE_HASH — re-run test/PoolInitCodeHash.t.sol.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"
via_ir = false
optimizer_runs = 200
auto_detect_remappings = false
remappings = [
    "@dclex-protocol/=lib/dclex-protocol/src/",
    "@ensdomains/=lib/dclex-blockchain/lib/v4-periphery/lib/v4-core/node_modules/@ensdomains/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@pythnetwork/pyth-sdk-solidity/=lib/dclex-blockchain/node_modules/@pythnetwork/pyth-sdk-solidity/",
    "@uniswap/v3-core/=lib/v3-core/",
    "@uniswap/v3-periphery/=lib/v3-periphery/",
    "base64-sol/=lib/base64/",
    "base64/=lib/base64/",
    "dclex-blockchain/=lib/dclex-blockchain/",
    "dclex-protocol/=lib/dclex-protocol/",
    "ds-test/=lib/dclex-blockchain/lib/v4-periphery/lib/v4-core/lib/forge-std/lib/ds-test/src/",
    "erc4626-tests/=lib/openzeppelin-contracts/lib/erc4626-tests/",
    "eth-gas-reporter/=lib/dclex-blockchain/node_modules/eth-gas-reporter/",
    "forge-gas-snapshot/=lib/dclex-blockchain/lib/v4-periphery/lib/v4-core/lib/forge-gas-snapshot/src/",
    "forge-std/=lib/forge-std/src/",
    "halmos-cheatcodes/=lib/openzeppelin-contracts/lib/halmos-cheatcodes/src/",
    "hardhat/=lib/dclex-blockchain/node_modules/hardhat/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
    "permit2/=lib/dclex-blockchain/lib/v4-periphery/lib/permit2/",
    "solmate/=lib/dclex-blockchain/lib/v4-periphery/lib/v4-core/lib/solmate/",
    "v3-core/=lib/v3-core/contracts/",
    "v3-periphery/=lib/v3-periphery/contracts/",
]
fs_permissions = [{ access = "read-write", path = "./out" }]
extra_output = ["storageLayout"]

# SeedLiquidity + PrintInitCalldata require via_ir due to stack depth —
# skip in default profile; run them with `forge build --via-ir` if needed.
skip = [
    "script/SeedLiquidity.s.sol",
    "script/PrintInitCalldata.s.sol",
]

# Pool deployment — skips DclexRouter and router-related scripts.
[profile.pool-deploy]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"
via_ir = false
optimizer_runs = 200
skip = [
    "src/DclexRouter.sol",
    "script/HelperConfig.s.sol",
    "script/InitializePool.s.sol",
    "script/DeployDclexRouterWithPools.s.sol",
    "script/RedeployRouter.s.sol",
]

# Router deployment — skips pool-init scripts.
[profile.router-deploy]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"
via_ir = false
optimizer_runs = 200
skip = [
    "script/HelperConfig.s.sol",
    "script/InitializePool.s.sol",
    "script/DeployDclexRouterWithPools.s.sol",
]

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
local = "http://127.0.0.1:8545"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
